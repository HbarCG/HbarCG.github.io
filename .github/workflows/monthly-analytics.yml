name: Monthly analytics

on:
  schedule:
    # 毎月4日 00:00 UTC (日本時間 09:00) に前月分を取得する。
    # Search Console のデータは2〜3日遅れて確定するので、1日ではなく4日に動かす
    - cron: "0 0 4 * *"
  workflow_dispatch:
    inputs:
      target_month:
        description: "集計対象月 (YYYY-MM)。空欄なら前月を自動集計"
        required: false

permissions:
  # data/analytics/ に取得結果をコミットするため
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch analytics
        env:
          TARGET_MONTH: ${{ inputs.target_month }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SITE_TAG: ${{ secrets.CLOUDFLARE_SITE_TAG }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
        run: node scripts/fetch-analytics.mjs

      - name: Commit analytics data
        run: |
          if [ -d data/analytics ] && git add data/analytics && ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: record monthly analytics"
            git push
          else
            echo "新しいデータはありません。コミットをスキップします。"
          fi
